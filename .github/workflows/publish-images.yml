name: Publish production images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: deploy/api.Dockerfile
          - name: bot
            file: deploy/bot.Dockerfile
          - name: update-engine
            file: deploy/update-engine.Dockerfile
          - name: document-worker
            file: deploy/document-worker.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dotacjapro-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/dotacjapro-${{ matrix.name }}:latest
          cache-from: type=gha,scope=publish-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.name }}
