name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @dotacjapro/db db:generate
        env:
          DATABASE_URL: postgresql://dotacjapro:dotacjapro@localhost:5432/dotacjapro
      - run: pnpm typecheck


  python-update-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r services/update-engine/requirements.txt
      - run: python -m compileall services/update-engine/app
      - run: pytest -q services/update-engine/tests


  python-document-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r services/document-worker/requirements.txt
      - run: python -m compileall services/document-worker/app
      - run: pytest -q
        working-directory: services/document-worker
