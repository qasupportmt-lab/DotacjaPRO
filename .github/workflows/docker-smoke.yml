name: Docker smoke

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "apps/miniapp/**"
      - "apps/api/**"
      - "apps/bot/**"
      - "services/update-engine/**"
      - "services/document-worker/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docker-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: miniapp
            file: deploy/miniapp.Dockerfile
          - name: api
            file: deploy/api.Dockerfile
          - name: bot
            file: deploy/bot.Dockerfile
          - name: update-engine
            file: deploy/update-engine.Dockerfile
          - name: document-worker
            file: deploy/document-worker.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: dotacjapro-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
